events {
    worker_connections 1024;
}

http {
    upstream jellyfin {
        server jellyfin:8096;
    }

    server {
        listen 80;
        server_name _;

        # WoL endpoint
        location /wake {
            access_log off;
            default_type text/plain;
            return 200 "Wake command sent to Mac\n";
        }

        # Health check that triggers WoL
        location = /health {
            proxy_pass http://jellyfin;
            proxy_intercept_errors on;
            error_page 502 503 504 = @wake;
        }

        # WoL wake trigger
        location @wake {
            default_type text/plain;
            return 503 "Jellyfin is waking up. Please wait...";
        }

        # Main Jellyfin proxy
        location / {
            proxy_pass http://jellyfin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_intercept_errors on;
            error_page 502 503 504 =503 /wake;
        }
    }
}